name: Bug report
description: Reproducible KittenTTS 2 Pro bug
labels: [bug]
body:
  - type: textarea
    id: summary
    attributes:
      label: Issue and reproduction steps
      description: Please include exact ComfyUI node settings and error, excluding private voice samples.
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Python / Torch / CUDA / ComfyUI version / OS
    validations:
      required: true
  - type: textarea
    id: traceback
    attributes:
      label: Console traceback (redact private paths and tokens)
